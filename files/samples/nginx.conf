# Velocity — Reverse proxy configuration for dev services

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    multi_accept on;
    use kqueue;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    '$request_time';

    access_log /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 100m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/rss+xml
        image/svg+xml;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=uploads:10m rate=5r/s;

    # Upstream services
    upstream velocity_api {
        server 127.0.0.1:8080;
        keepalive 32;
    }

    upstream velocity_ws {
        server 127.0.0.1:9090;
        keepalive 16;
    }

    upstream minio_console {
        server 127.0.0.1:9001;
    }

    # ── Main server ─────────────────────────────────────────

    server {
        listen 443 ssl http2;
        server_name velocity.local;

        ssl_certificate     /etc/nginx/ssl/velocity.local.crt;
        ssl_certificate_key /etc/nginx/ssl/velocity.local.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        # Security headers
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # API proxy
        location /api/ {
            limit_req zone=api burst=50 nodelay;

            proxy_pass http://velocity_api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            proxy_send_timeout 10s;
        }

        # WebSocket for live file events
        location /ws/ {
            proxy_pass http://velocity_ws/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # File uploads
        location /upload/ {
            limit_req zone=uploads burst=10 nodelay;

            proxy_pass http://velocity_api/upload/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_request_buffering off;
            client_max_body_size 5g;
        }

        # Static assets
        location /static/ {
            alias /var/www/velocity/static/;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # Health check
        location /health {
            proxy_pass http://velocity_api/health;
            access_log off;
        }

        location / {
            root /var/www/velocity;
            try_files $uri $uri/ /index.html;
        }
    }

    # ── HTTP redirect ───────────────────────────────────────

    server {
        listen 80;
        server_name velocity.local;
        return 301 https://$host$request_uri;
    }

    # ── MinIO console ───────────────────────────────────────

    server {
        listen 443 ssl http2;
        server_name minio.velocity.local;

        ssl_certificate     /etc/nginx/ssl/velocity.local.crt;
        ssl_certificate_key /etc/nginx/ssl/velocity.local.key;

        location / {
            proxy_pass http://minio_console;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
