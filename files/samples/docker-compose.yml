version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SWIFT_VERSION: "6.0"
        BUILD_CONFIG: Debug
    container_name: velocity-dev
    ports:
      - "8080:8080"
      - "9090:9090"
    volumes:
      - ./Sources:/app/Sources
      - ./Tests:/app/Tests
      - ./Resources:/app/Resources
      - index-data:/var/lib/velocity/index
      - cache-data:/var/lib/velocity/cache
    environment:
      - VELOCITY_ENV=development
      - VELOCITY_LOG_LEVEL=debug
      - VELOCITY_INDEX_PATH=/var/lib/velocity/index
      - VELOCITY_CACHE_PATH=/var/lib/velocity/cache
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=velocity_dev
      - DB_USER=velocity
      - DB_PASSWORD=${DB_PASSWORD:-devpassword}
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - velocity-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  postgres:
    image: postgres:16-alpine
    container_name: velocity-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: velocity_dev
      POSTGRES_USER: velocity
      POSTGRES_PASSWORD: ${DB_PASSWORD:-devpassword}
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql
    networks:
      - velocity-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U velocity -d velocity_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: velocity-redis
    ports:
      - "6379:6379"
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    networks:
      - velocity-net

  minio:
    image: minio/minio:latest
    container_name: velocity-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    networks:
      - velocity-net

volumes:
  pg-data:
    driver: local
  redis-data:
    driver: local
  index-data:
    driver: local
  cache-data:
    driver: local
  minio-data:
    driver: local

networks:
  velocity-net:
    driver: bridge
